  rationale: On 2026-10-28 the assistant first gave a breadboard power module sim plan, then the user corrected that only one 9V battery with a barrel plug was available and asked for a rethink, and the assistant replanned around the battery into the barrel jack. In the same session the RGB LED identity was also uncertain until the user sent a photo, after which the assistant gave a leg by leg test procedure. The same MB-102 input versus output confusion had already been learned on 2026-10-26, so the lesson was not retained as a reusable method. This skill forces inventory first, one named power entry, USB disconnected before test power, a divider for voltages above 5 volts, and pin testing before full wiring, which directly addresses each correction in the cited messages. No existing skill matched an Arduino breadboard search, and the deterministic suppressed handoff candidates were rejected because they concern objective trigger cadence, not a teachable method.
