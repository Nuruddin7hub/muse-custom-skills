  rationale: 'The Cook skill step 1 says never ask a question after intake, decide, log the decision under Decisions in ROUNDS.md, and keep working. Despite that, the supervisor invented user call flags in every coordinator brief from number 18 onward and parked the thumbnail replacement for four rounds while the critics named it the top fix. The user corrected this on 2026-11-21 (message:370626e1), the assistant admitted the flags were its own invention (message:assistant-msg-34c45308), the correction was rescinded the same turn, and Round 88 then built the thumbnail replacement, the first build since Round 82. The correction was acted on in session only, with no durable rule recording it. Skill search found no other skill covering invented authority limits in delegated briefs, and the managed long_running_loop_supervision skill is the document that governs coordinator briefs, stall handling, and resume, so the decide and log rule belongs there. Other candidates were rejected: the write-block failures are already covered by safe_file_saves published 2026-11-20 and still inside its measurement window, the Outlook 12th consecutive block and the GitHub approval-card timeout need a user action rather than a teachable method, and the handoff suppression and goals_bookkeeping rollups name no concrete method failure.'
