name: safe_file_saves
title: Save Files Safely
description: Save a file so a failed write cannot empty or corrupt it, and recover from the source of truth when a save fails.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
  evidence_handles:
  - message:18b43c93-ded9-36d5-97ce-4ea526f45ac6
  - message:9ab8fa8d-bb1f-410b-a3eb-551f24e21692
