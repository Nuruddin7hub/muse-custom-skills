  needs_review: false
  rationale: Two incidents in the same window share one root cause. The assistant drafted a false missed final VR message to a lecturer after merging HSE VR attendance with Module 5 homework, and the user corrected that he had attended VR on 30 Sept in Group 22 and that VR and Module 5 have no correlation. The same day Quiz 3 was reported as 3 to 7 AM, then 3 to 7 PM, then three different windows, before the PM time was verified on the quiz page. Both failures came from reporting a secondary source or a merged record without re-reading the authoritative page for the exact item. Skill searches for ULearn checks, deadline verification, and authoritative source verification found no skill covering this method, and only one learned skill exists so no consolidation applies. This single new skill teaches one item at a time, separate activities, and message drafting only from explicit evidence.
