    success_criterion: After a stop or retire decision in chat, no scheduled job runs the retired method or channel within 30 days, and a re-read of each affected job definition shows the retired steps removed rather than only the enabled flag changed.
    window_days: 30
  rationale: 'Kind retired the scored-audit approach on 2026-11-05 and the Lazada prospecting channel was stopped, yet the 7am prospect and 9am outreach jobs kept running the old routine and produced 9 new Lazada drafts on 2026-11-06 (message:assistant-msg-a795184e-e9ee-db98-af42-15b4c60cd014). Kind asked why Lazada chatting was still happening (message:46921795-634c-443e-8499-a76189137a46) and the assistant admitted the jobs were written before the decision and never updated or paused after it (message:assistant-msg-310dfd7e-42e7-4cd5-a445-f03cc5125715). I re-read both job definitions this run: motorlist-morning-prospect still instructs scoring listings 1 to 10 and building a watermarked audit PDF, and motorlist-outreach-queue still instructs mentioning the attached watermarked audit, even though both jobs are now paused, so re-enabling them would resume the retired method. No existing skill covers this: skill searches for scheduled jobs, cron pause, and channel-stop prospecting returned only flight tracking, scheduling, and customer outreach, none of which teaches propagating a chat decision into scheduled job definitions. The deterministic suppressed-handoff candidates were rejected because they concern objective trigger cadence, not a teachable method, and the course-verification skill published 2026-11-05 is inside its measurement window and covers a different failure.'
