  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: After a stop, retire, or account change, no scheduled job runs the retired method or names the retired account within 30 days, and no timed post is promised without a verified enabled job naming the current account.
    window_days: 30
  rationale: The Instagram publish job still named the banned account and was switched off after the account was disabled on 2026-11-13, so the second 18:40 post was missed and the user asked why it did not post (message:cca43e79). The assistant admitted the job was switched off and stale and still named the banned account (message:assistant-msg-af2d5f9e), the user approved making it automatic (message:a4d9a29c), and the job was rewritten with the new account and switched on (message:assistant-msg-a10b4027). A later automatic run opened a fresh window, hit an Instagram login, and posted nothing (message:assistant-msg-e4482e60). The existing skill covers retired methods but does not treat an account change as a job change and does not require a live enabled-job, current-account, and signed-in-session check before promising a timed post. This update adds that check to the managed skill it already belongs to, rather than creating a second skill.
