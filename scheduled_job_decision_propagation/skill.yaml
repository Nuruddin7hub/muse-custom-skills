name: scheduled_job_decision_propagation
title: Propagate Decisions to Scheduled Jobs
description: When a method, channel, or approach is stopped or retired, or an account is disabled or replaced, update or pause the scheduled jobs and runbooks that still carry it, and verify a timed post job is live and current before you promise it.
category: Work and knowledge
include_in_prompt: false
